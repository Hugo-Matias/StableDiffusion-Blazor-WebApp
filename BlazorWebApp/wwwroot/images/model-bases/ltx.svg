<!-- LTX: Lightning bolt representing speed and efficiency -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="24" height="24">
  <defs>
    <linearGradient id="ltx-grad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#a3e635;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#84cc16;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Lightning bolt -->
  <polygon points="17,3 9,16 15,16 13,29 24,14 17,14" fill="url(#ltx-grad)" stroke="#84cc16" stroke-width="0.5"/>
  <!-- Speed lines -->
  <line x1="6" y1="8" x2="10" y2="10" stroke="url(#ltx-grad)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="4" y1="14" x2="9" y2="15" stroke="url(#ltx-grad)" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  <!-- Spark accent -->
  <circle cx="17" cy="16" r="1" fill="#fff" opacity="0.8"/>
</svg>
