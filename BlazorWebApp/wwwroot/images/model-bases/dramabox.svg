<!-- DramaBox: Waveform and voice bubble representing voice cloning / TTS -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="24" height="24">
  <defs>
    <linearGradient id="dramabox-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Speech bubble outline -->
  <path d="M6,6 L22,6 Q26,6 26,10 L26,18 Q26,22 22,22 L15,22 L10,27 L10,22 L6,22 Q2,22 2,18 L2,10 Q2,6 6,6 Z"
        fill="none" stroke="url(#dramabox-grad)" stroke-width="1.5"/>
  <!-- Voice waveform bars inside bubble -->
  <rect x="8" y="13" width="2" height="6" rx="1" fill="url(#dramabox-grad)"/>
  <rect x="12" y="10" width="2" height="12" rx="1" fill="url(#dramabox-grad)"/>
  <rect x="16" y="11" width="2" height="10" rx="1" fill="url(#dramabox-grad)" opacity="0.8"/>
  <rect x="20" y="13" width="2" height="6" rx="1" fill="url(#dramabox-grad)" opacity="0.6"/>
  <!-- Mic dot accent -->
  <circle cx="14" cy="16" r="1.5" fill="#fff" opacity="0.7"/>
</svg>
