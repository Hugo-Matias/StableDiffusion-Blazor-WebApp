<!-- Wan: Motion arcs representing animation and video -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="24" height="24">
  <defs>
    <linearGradient id="wan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Play triangle center -->
  <polygon points="13,9 13,23 24,16" fill="url(#wan-grad)"/>
  <!-- Motion arcs (left side) -->
  <path d="M8,10 Q4,16 8,22" fill="none" stroke="url(#wan-grad)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M5,7 Q0,16 5,25" fill="none" stroke="url(#wan-grad)" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <!-- Motion arcs (right side) -->
  <path d="M28,10 Q30,16 28,22" fill="none" stroke="url(#wan-grad)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
</svg>
