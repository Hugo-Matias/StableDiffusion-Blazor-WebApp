<!-- Flux: Flowing stream lines representing continuous flow -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="24" height="24">
  <defs>
    <linearGradient id="flux-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Flowing wave streams -->
  <path d="M4,12 Q10,6 16,12 T28,12" fill="none" stroke="url(#flux-grad)" stroke-width="2" stroke-linecap="round"/>
  <path d="M4,17 Q10,11 16,17 T28,17" fill="none" stroke="url(#flux-grad)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M4,22 Q10,16 16,22 T28,22" fill="none" stroke="url(#flux-grad)" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <!-- Flow droplets -->
  <circle cx="16" cy="12" r="2" fill="#06b6d4"/>
</svg>
