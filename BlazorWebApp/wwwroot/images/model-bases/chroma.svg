<!-- Chroma: Color spectrum arc representing chromatic range -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="24" height="24">
  <defs>
    <linearGradient id="chroma-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#eab308;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Outer arc -->
  <path d="M4,24 A14,14 0 0,1 28,24" fill="none" stroke="url(#chroma-grad)" stroke-width="3" stroke-linecap="round"/>
  <!-- Inner arc -->
  <path d="M9,24 A9,9 0 0,1 23,24" fill="none" stroke="url(#chroma-grad)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- Center prism triangle -->
  <polygon points="16,10 12,20 20,20" fill="url(#chroma-grad)" opacity="0.8"/>
</svg>
