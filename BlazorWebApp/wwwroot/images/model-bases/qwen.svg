<!-- Qwen: Neural network nodes representing intelligence -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="24" height="24">
  <defs>
    <linearGradient id="qwen-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Connection lines -->
  <line x1="16" y1="6" x2="8" y2="16" stroke="url(#qwen-grad)" stroke-width="1.5" opacity="0.6"/>
  <line x1="16" y1="6" x2="24" y2="16" stroke="url(#qwen-grad)" stroke-width="1.5" opacity="0.6"/>
  <line x1="8" y1="16" x2="16" y2="26" stroke="url(#qwen-grad)" stroke-width="1.5" opacity="0.6"/>
  <line x1="24" y1="16" x2="16" y2="26" stroke="url(#qwen-grad)" stroke-width="1.5" opacity="0.6"/>
  <line x1="8" y1="16" x2="24" y2="16" stroke="url(#qwen-grad)" stroke-width="1.5" opacity="0.4"/>
  <!-- Nodes -->
  <circle cx="16" cy="6" r="3" fill="url(#qwen-grad)"/>
  <circle cx="8" cy="16" r="2.5" fill="url(#qwen-grad)" opacity="0.8"/>
  <circle cx="24" cy="16" r="2.5" fill="url(#qwen-grad)" opacity="0.8"/>
  <circle cx="16" cy="26" r="3" fill="url(#qwen-grad)"/>
  <!-- Center spark -->
  <circle cx="16" cy="16" r="1.5" fill="#fff" opacity="0.9"/>
</svg>
