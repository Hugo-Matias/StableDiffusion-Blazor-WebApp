<!-- ZImage: Stylized Z with image frame -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="24" height="24">
  <defs>
    <linearGradient id="zimg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Image frame -->
  <rect x="3" y="3" width="26" height="26" rx="4" fill="none" stroke="url(#zimg-grad)" stroke-width="1.5"/>
  <!-- Stylized Z -->
  <path d="M10,11 L22,11 L10,21 L22,21" fill="none" stroke="url(#zimg-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Corner accent dots -->
  <circle cx="6" cy="6" r="1" fill="url(#zimg-grad)" opacity="0.6"/>
  <circle cx="26" cy="6" r="1" fill="url(#zimg-grad)" opacity="0.6"/>
  <circle cx="6" cy="26" r="1" fill="url(#zimg-grad)" opacity="0.6"/>
  <circle cx="26" cy="26" r="1" fill="url(#zimg-grad)" opacity="0.6"/>
</svg>
