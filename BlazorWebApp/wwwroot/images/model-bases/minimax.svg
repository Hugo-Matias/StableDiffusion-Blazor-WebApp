<!-- MiniMax: three orbiting nodes (text/vision/audio) fusing into one core, representing omni-modal generation -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="24" height="24">
  <defs>
    <linearGradient id="minimax-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e11d48;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Orbit ring -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="url(#minimax-grad)" stroke-width="1.25" opacity="0.35"/>
  <!-- Orbiting modality nodes -->
  <circle cx="16" cy="5" r="3" fill="url(#minimax-grad)"/>
  <circle cx="25.5" cy="21.5" r="3" fill="url(#minimax-grad)" opacity="0.85"/>
  <circle cx="6.5" cy="21.5" r="3" fill="url(#minimax-grad)" opacity="0.7"/>
  <!-- Fusion core -->
  <circle cx="16" cy="16" r="4" fill="#fff"/>
  <circle cx="16" cy="16" r="4" fill="url(#minimax-grad)" opacity="0.9"/>
</svg>
